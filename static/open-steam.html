<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening in Steam</title>
<!-- Opens a game's store page in the Steam app (steam://), falling back to the website if Steam doesn't take it.
     Used as /static/open-steam.html?app=<Steam app id> -->
<style>
  :root { color-scheme:dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#141518; color:#ececef;
    font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align:center; }
  main { padding:24px 16px; max-width:420px; }
  h1 { font-size:22px; margin:0 0 6px; }
  p { color:#9a9ba3; margin:0 0 16px; }
  a { color:#8d96ff; }
  button { font:inherit; padding:9px 16px; border:0; border-radius:8px; background:#5865f2; color:#fff; cursor:pointer; }
  [hidden] { display:none; }
  .spin { width:28px; height:28px; margin:0 auto 14px; border-radius:50%; border:3px solid #2d2f35; border-top-color:#8d96ff;
    animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
</style>
</head>
<body>
<main>
  <div class="spin" id="spin"></div>
  <h1 id="title">Opening in Steam…</h1>
  <p id="text">If your browser asks, choose to open Steam.</p>
  <p id="choice" hidden><button id="close">Steam opened, close this tab</button></p>
  <p><a id="web" href="https://store.steampowered.com/">Open the store page in the browser instead</a></p>
</main>
<script>
  const app = (new URLSearchParams(location.search).get("app") || "").replace(/\D/g, "");
  const web = app ? `https://store.steampowered.com/app/${app}/` : "https://store.steampowered.com/";
  document.getElementById("web").href = web;
  const $ = (id) => document.getElementById(id);
  // Close this tab. Chrome, Edge, Brave and Opera allow it for a tab opened from another app or a link;
  // Firefox and Safari may refuse, so then just say Steam opened.
  function closeTab() {
    window.close();
    setTimeout(() => {
      $("spin")?.remove();
      $("choice").hidden = true;
      $("title").textContent = "Opened in Steam";
      $("text").textContent = "You can close this tab.";
    }, 300);
  }
  $("close").addEventListener("click", closeTab);
  if (app) {
    const started = Date.now();
    location.href = `steam://store/${app}`;
    // The page can only tell what happened from its focus:
    // - focus lost right away (< 0.4 s): the browser is asking "Open Steam?";
    //     Open -> focus comes back, then Steam takes it -> close;
    // - focus lost a bit later, or after the question was answered: Steam took over -> close;
    // - otherwise (Cancel, or Steam opened quietly behind the browser, or isn't installed) the page can't tell
    //   which, so it asks with two buttons rather than opening the store page on top of Steam.
    let state = "waiting", answered;
    function ask() {
      state = "unsure";  // a later blur (Steam came forward after all) still closes the tab
      $("spin")?.remove();
      $("title").textContent = "Did Steam open?";
      $("text").textContent = "If Steam opened the game, close this tab. If not, open the store page below.";
      $("choice").hidden = false;
    }
    addEventListener("blur", () => {
      if (state === "waiting" && Date.now() - started < 400) { state = "asking"; return; }
      if (state === "done") return;
      clearTimeout(answered);
      state = "done";
      closeTab();
    });
    addEventListener("focus", () => {
      if (state !== "asking") return;
      state = "answered";
      answered = setTimeout(ask, 1500);
    });
    setTimeout(() => { if (state === "waiting") ask(); }, 2500);
  } else {
    location.replace(web);
  }
</script>
</body>
</html>
