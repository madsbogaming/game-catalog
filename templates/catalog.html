  .replace(/&lt;#\d+&gt;/g, "#channel").replace(/&lt;@&amp;\d+&gt;/g, "@role");

// Steam dates can be exact ("14 Jan, 2027") or vague ("Coming soon", "Q1 2027"); vague ones aren't out yet.
const isUpcoming = (e) => e.release_ts ? e.release_ts > Date.now() / 1000 : !!e.release_date;
const releaseText = (e) => !e.release_date ? ""
  : isUpcoming(e) ? `<span class="soon">${icon("hourglass")}${e.release_ts ? "Releases " : ""}${esc(e.release_date)}</span>`
  : `<span>${icon("calendar")}Released ${esc(e.release_date)}</span>`;


// Steam's review colour: by the summary word when there is one, else by the score.
const reviewTone = (e) => /negative/i.test(e.review_desc || "") ? "neg" : /mixed/i.test(e.review_desc || "") ? "mixed"
  : /positive/i.test(e.review_desc || "") ? "pos" : e.review_pct >= 70 ? "pos" : e.review_pct >= 40 ? "mixed" : "neg";

// Steam games open in the Steam app: a small page served by the bot hands the game to Steam (steam://), and shows
// the store website if Steam doesn't take it. Inside Discord it needs the bot's public address to open in the browser.
// Battle.net app codes (battlenet://<code> opens the game in the Battle.net app; the app logs them as "game family")
const BNET_APPS = { "world of warcraft": "WoW", "world of warcraft: forever": "WoWF", "world of warcraft classic": "WoWC",
                    "diablo iv": "Fen",
                    "hearthstone": "WTCG", "heroes of the storm": "Hero", "starcraft ii": "S2", "overwatch": "Pro" };
function gameLink(e) {
  const app = e.kind === "steam" && /\/app\/(\d+)/.exec(e.url)?.[1];
  const bnet = e.kind === "battlenet" && BNET_APPS[e.title.toLowerCase()];
  if ((!app && !bnet) || !CONFIG.live || (IN_DISCORD && !CONFIG.publicUrl)) return e.url;  // no public address yet: the store page
  const base = IN_DISCORD ? CONFIG.publicUrl : "";
  return app ? `${base}/static/open-steam.html?app=${app}`
    : `${base}/static/open-battlenet.html?app=${bnet}&name=${encodeURIComponent(e.title)}&web=${encodeURIComponent(e.url)}`;
}

// Top-right of the cover: Playing / the group's status, with "↩ 2" joined on when people refunded it
function coverBadge(e) {
  const status = e.players.length ? `<span class="badge playing">Playing</span>`
    : BADGE[e.status] ? `<span class="badge ${e.status}">${BADGE[e.status]}</span>` : "";
  if (!e.refunds.length) return status;
  const refund = `<span class="badge refund" data-id="${e.id}" aria-label="Refunded by ${esc(e.refunds.map((p) =>
    person(p.id, p.name).name).join(", "))}">${icon("receipt-refund")}${e.refunds.length}<span class="rf-word">&nbsp;refunded</span></span>`;
  return `<span class="badge-split">${status}${refund}</span>`;
}

// Time left on a Steam sale, after the percentage: grey with a week or more to go, then amber, then red at the end
const ENDS_COLORS = [[143, 163, 176], [240, 178, 50], [242, 71, 71]];  // grey, amber (rating stars), red
function endsColor(k) {
  const t = k * (ENDS_COLORS.length - 1), i = Math.min(Math.floor(t), ENDS_COLORS.length - 2), f = t - i;
  return `rgb(${ENDS_COLORS[i].map((c, j) => Math.round(c + (ENDS_COLORS[i + 1][j] - c) * f)).join(",")})`;
}
function saleEnds(e) {
  const h = (e.discount_ends * 1000 - Date.now()) / 36e5;
  if (!e.discount_ends || h <= 0) return "";
  const k = (1 - Math.min(h, 168) / 168) ** 2;  // 0 a week or more out, 1 at the very end
  const left = h >= 48 ? `${Math.floor(h / 24)}d` : h >= 24 ? `1d ${Math.floor(h - 24)}h` : `${Math.max(1, Math.round(h))}h`;
  const end = new Date(e.discount_ends * 1000);
  const when = `${end.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })}, ${
    end.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })}`;
  return `<span class="sale-end" style="--ends:${endsColor(k)}" title="Sale ends ${esc(when)}">${
    icon("clock")}<span class="sale-left">${left}</span></span>`;
}

// -- A card's tags and people take one line each where they can: as many as fit, the rest behind a "+N" that lists
// them (hover, or tap on phones). How many fit depends on the screen, so the sizes are measured on a hidden card
// once per layout (every card in the grid is the same width), and each card then works out its own count. --
let fit = null;
const openTags = new Set();  // cards whose "+N" tags were pressed open
const PEOPLE = { added: ["Added", "Added by"], playing: ["Playing", "Playing now"], played: ["Played", "Played by"],
                 refunds: ["Refunded", "Refunded by"], wants: ["Wants", "Wants to play"] };
// Who played it, minus anyone in the Playing pill right now (they still count towards Played)
const playedNotPlaying = (e) => e.played_by.filter((id) => !e.players.some((p) => p.id === id)).map((id) => ({ id }));
const OLD_PLAYED =`Marked Played before a game needed ${PLAYERS_NEEDED} players`;
function measureFit() {
  const grid = $("grid"), tags = [...new Set(DATA.flatMap(tagsOf))];
  const pill = (label, faces, extra = "") => `<span class="pp"><span class="pp-l">${label}</span>${
    `<span class="av"></span>`.repeat(faces)}${extra}</span>`;
  const probe = document.createElement("article");
  probe.className = "card fit-probe";
  probe.innerHTML = `<div class="body"><div class="chips">${tags.map(chipHtml).join("")}<button class="chip chip-more">+8</button>
    <button class="chip chip-more">+88</button></div><div class="foot"><div class="people">${
    Object.values(PEOPLE).map(([l]) => pill(l, 0)).join("")}${pill("Played before the rule", 0)}${pill("x", 0)}${pill("x", 1)}${
    pill("x", 2)}${pill("x", 1, `<span class="pp-old">${icon("clock")}</span>`)}${pill("x", 1, `<button class="pp-more">+8</button>`)}${
    pill("x", 1, `<button class="pp-more">+88</button>`)}</div></div></div>`;
  grid.append(probe);
  const people = probe.querySelector(".people"), chips = probe.querySelector(".chips");
  const w = (el) => el.getBoundingClientRect().width;
  const pills = [...people.children].map(w), chipW = [...chips.children].map(w);
  const keys = Object.keys(PEOPLE), at = keys.length;  // the test pills come after the labels
  const next = {
    people: people.clientWidth, chips: chips.clientWidth,
    gap: parseFloat(getComputedStyle(people).columnGap) || 0, chipGap: parseFloat(getComputedStyle(chips).columnGap) || 0,
    label: Object.fromEntries([...keys.map((k, i) => [k, pills[i]]), ["playedOld", pills[at]]]),
    face: pills[at + 2] - pills[at + 1], step: pills[at + 3] - pills[at + 2], old: pills[at + 4] - pills[at + 2],
    more: [pills[at + 5] - pills[at + 2], pills[at + 6] - pills[at + 2]],
    tag: Object.fromEntries(tags.map((t, i) => [t, chipW[i]])), tagMore: chipW.slice(-2),
  };
  probe.remove();
  if (next.people > 0) fit = next;  // hidden (the minimised poster): keep the last sizes
}
// Lines a row of pieces takes, wrapped like the browser wraps them
function linesFor(widths, room, gap) {
  let lines = 1, x = -gap;
  for (const w of widths) {
    if (w > room + .5) lines += 100;  // wider than the card: never a fit, however few lines it takes
    if (x > 0 && x + gap + w > room + .5) { lines++; x = w; } else x += gap + w;
  }
  return lines;
}
// How many tags fit on one line, leaving room for the "+N"
function tagsThatFit(tags) {
  if (!fit) return tags.length;
  const w = tags.map((t) => fit.tag[t] ?? 80), sum = (n) => w.slice(0, n).reduce((a, b) => a + b, 0) + fit.chipGap * Math.max(0, n - 1);
  if (sum(tags.length) <= fit.chips + .5) return tags.length;
  for (let n = tags.length - 1; n > 0; n--) {
    if (sum(n) + fit.chipGap + fit.tagMore[tags.length - n > 9 ? 1 : 0] <= fit.chips + .5) return n;
  }
  return 0;
}
// How many faces each group shows: all of them if that doesn't take more lines than one face each would;
// otherwise faces come off the biggest group first until it does
function facesThatFit(groups) {
  const shown = groups.map((g) => g.list.length);
  if (!fit) return shown;
  const width = (g, n) => fit.label[g.key] + (n ? fit.face + (n - 1) * fit.step : 0) + (g.old ? fit.old : 0)
    + (n < g.list.length ? fit.more[g.list.length - n > 9 ? 1 : 0] : 0);
  const lines = (counts) => linesFor(groups.map((g, i) => width(g, counts[i])), fit.people, fit.gap);
  const fewest = lines(groups.map((g) => Math.min(1, g.list.length)));
  while (lines(shown) > fewest) {
    const i = shown.reduce((best, n, j) => n > 1 && (best < 0 || n > shown[best]) ? j : best, -1);
    if (i < 0) break;
    shown[i]--;
  }
  // Room left on the last line goes back to the groups, a face at a time each
  for (let grew = true; grew;) {
    grew = false;
    shown.forEach((n, i) => {
      if (n >= groups[i].list.length) return;
      shown[i]++;
      if (lines(shown) > fewest) shown[i]--; else grew = true;
    });
  }
  return shown;
}
function peopleLine(e) {
  const old = beforeRule(e);
  const all = { added: e.added_by ? [{ id: e.added_by, name: e.added_by_name }] : [], playing: e.players,
                played: playedNotPlaying(e), refunds: e.refunds, wants: e.interested };
  const groups = Object.keys(PEOPLE).filter((k) => all[k].length || (k === "played" && old)).map((k) => ({
    kind: k, list: all[k], key: k === "played" && old && !all[k].length ? "playedOld" : k, old: k === "played" && old && all[k].length > 0 }));
  if (!e.added_by) groups.unshift({ kind: "added", list: [], key: "added", name: e.added_by_name || "someone" });
  const shown = facesThatFit(groups);
  return `<div class="people">${groups.map((g, i) => {
    const hidden = g.list.length - shown[i];
    const list = `data-id="${e.id}" data-list="${g.kind}"`;
    return `<span class="pp"><span class="pp-l" ${g.list.length ? list
      : `title="${g.key === "playedOld" ? OLD_PLAYED : PEOPLE[g.kind][1]}"`}>${
      g.key === "playedOld" ? "Played before the rule" : PEOPLE[g.kind][0]}</span>${g.name ? `<span class="pp-name">${esc(g.name)}</span>` : ""}${
      g.old ? `<span class="pp-old" title="${OLD_PLAYED}">${icon("clock")}</span>` : ""}${
      g.list.slice(0, shown[i]).map((p) => avatar(p.id, p.name)).join("")}${hidden ? `<button class="pp-more" data-id="${e.id}"
      data-list="${g.kind}" aria-label="${hidden} more">+${hidden}</button>` : ""}</span>`;
  }).join("")}</div>`;
}
// A new layout (window size, cards per row) or new tags: measure again, and redraw if anything moved
const fitKey = () => fit && JSON.stringify([fit.people, fit.chips, fit.face, fit.label]);
function refit() {
  const was = fitKey();
  measureFit();
  if (fitKey() !== was) render();
}
let fitWidth = 0, fitTimer;
new ResizeObserver(([en]) => {
  if (Math.abs(en.contentRect.width - fitWidth) < 1) return;  // a taller grid is no new layout
  fitWidth = en.contentRect.width;
  clearTimeout(fitTimer);
  fitTimer = setTimeout(refit, 120);
}).observe($("grid"));

function card(e) {
  const meta = [
    e.discount_pct && e.price_full_text  // on sale: shown like Steam shows it
      ? `<span class="sale" title="On sale on Steam"><span class="sale-prices"><s>${esc(e.price_full_text)}</s>
          <span>${esc(e.price_text)}</span></span><span class="sale-pct">−${e.discount_pct}%</span>${saleEnds(e)}</span>`
      : e.price_text && `<span class="price">${esc(e.price_text)}</span>`,
    e.review_pct != null && `<span class="rev ${reviewTone(e)}">${e.review_pct}% ${esc(e.review_desc || "")}</span>`,
    e.coop ? `<span>${icon("users")}Co-op</span>` : e.multiplayer && `<span>${icon("users-group")}Multiplayer</span>`,
    releaseText(e),
  ].filter(Boolean).join("");
  const tags = tagsOf(e), fitTags = tagsThatFit(tags), allTags = openTags.has(e.id) && fitTags < tags.length;
  const chips = allTags
    ? tags.map(chipHtml).join("") + `<button class="chip chip-more" data-id="${e.id}" aria-expanded="true">Show less</button>`
    : tags.slice(0, fitTags).map(chipHtml).join("") + (fitTags < tags.length
      ? `<button class="chip chip-more" data-id="${e.id}" aria-expanded="false" aria-label="${tags.length - fitTags} more tags">+${tags.length - fitTags}</button>` : "");
  // Reels of the game: just the film icon, one per clip, above the line
  const clips = e.clips.map((u, i) => `<a class="clip" href="${esc(u)}" target="_blank" rel="noopener"
    title="Watch clip${e.clips.length > 1 ? ` ${i + 1}` : ""}" aria-label="Watch clip ${i + 1}">${icon("movie")}</a>`).join("");
  // Loaded when it nears the screen; a cover that was already shown is drawn right away, so redraws don't blink
  const img = !e.image ? "" : shownCovers.has(imgUrl(e.image)) ? `style="background-image:url('${esc(imgUrl(e.image))}')"`
    : `data-bg="${esc(imgUrl(e.image))}"`;
  return `<article class="card" id="g${e.id}">
    <a class="img" href="${esc(gameLink(e))}" target="_blank" rel="noopener" ${img}>
      ${isUpcoming(e) ? `<span class="badge upcoming">Not released</span>` : ""}
      ${coverBadge(e)}
      ${e.ratings.length ? `<span class="rating-pill" data-id="${e.id}" aria-label="${esc(ratersTitle(e))}">${
        icon("star")}${avgRating(e).toFixed(1)}<span>· ${e.ratings.length}</span>${
        e.ratings.some((r) => r.played) ? playedBadge(e.ratings.filter((r) => r.played).length) : ""}</span>` : ""}</a>
    <div class="body">
      <a class="title" href="${esc(gameLink(e))}" target="_blank" rel="noopener">${esc(e.title)}</a>
      <div class="meta">${meta}</div>
      ${chips && `<div class="chips${allTags ? " all" : ""}">${chips}</div>`}
      ${clips && `<div class="clips">${clips}</div>`}
      ${CAN_WANT && (["played", "demo"].includes(e.status) || iPlayed(e)) ? rateRow(e) : ""}
      ${e.kind === "instagram" ? `<div class="meta"><span>${icon("help-circle")}Reel not linked to a game yet</span></div>` : ""}
      ${e.note ? `<div class="note">“${noteHtml(e.note)}”</div>` : ""}
      <div class="foot">
        ${peopleLine(e)}
        ${CAN_WANT ? `<div class="actions">${wantButton(e)}
          <div class="card-tools">${playButton(e)}${pingButton(e)}${statusPick(e)}</div></div>` : ""}
      </div>
    </div>

}

// Covers are only fetched once their card comes near the screen: opening the catalog then loads a dozen
// pictures instead of all ~500
const shownCovers = new Set();
const covers = new IntersectionObserver((entries) => entries.forEach((en) => {
  if (!en.isIntersecting) return;
  en.target.style.backgroundImage = `url('${en.target.dataset.bg}')`;
  shownCovers.add(en.target.dataset.bg);
  covers.unobserve(en.target);
}), { rootMargin: "800px 0px" });

// Drawing all ~560 cards takes the browser over half a second, and the page redraws after every click and every
// change anyone makes. So only the parts that changed are swapped; a different order or set of games (a new
// search, sort or filter) draws the grid anew.
let drawnParts = [];
function drawGrid(parts) {
  const grid = $("grid");
  const changed = parts.length === drawnParts.length && grid.children.length === parts.length
    ? parts.map((p, i) => p === drawnParts[i] ? -1 : i).filter((i) => i >= 0) : null;
  if (!changed || changed.length > 40) {
    grid.innerHTML = parts.join("");
  } else {
    const tpl = document.createElement("template");
    changed.forEach((i) => { tpl.innerHTML = parts[i]; grid.children[i].replaceWith(tpl.content.firstElementChild); });
  }
  drawnParts = parts;
  grid.querySelectorAll("[data-bg]").forEach((el) => covers.observe(el));
}

function render() {
  const q = $("q").value.trim().toLowerCase(), st = $("status").value;
  // "Refunded" shows every game at least one of us refunded
  const statusOk = (e) => st === "refunded" ? e.refunds.length > 0
    : !st || st === "mine" || e.status === st || (st === "want" && e.status === "demo");
  $("status-mine").hidden = !me;  // "Games I want to play": the games you said yes to (needs you signed in)
  const sort = SORTS[$("sort").value];
  queueMicrotask(() => { $("count").textContent = `${$("grid").querySelectorAll(".card").length} games`; });
  const rows = DATA.filter((e) =>
    (!q || [e.title, e.note, e.description, ...tagsOf(e)].some((s) => (s || "").toLowerCase().includes(q))) &&
    (!picked.size || [...picked].every((t) => tagsOf(e).includes(t))) && statusOk(e) && (st !== "mine" || isMine(e)) &&
    (!personFilter || PERSON_FILTERS[personFilter.kind].ok(e, personFilter.id, personFilter.stars))
  ).sort(sort);  // games being played keep their badge and the feed above, but sort like the rest
  $("person").hidden = !personFilter;
  if (personFilter) {
    const f = PERSON_FILTERS[personFilter.kind];
    $("person").innerHTML = `${icon(f.icon)}<span class="person-name">${esc(f.chip(shortName(personFilter.id), personFilter.stars))}</span>
      <button type="button" id="person-clear" title="Show everyone's games" aria-label="Show everyone's games">${icon("x")}</button>`;
  }
  if (!fit || DATA.some((e) => tagsOf(e).some((t) => !(t in fit.tag)))) {  // first draw, or a new tag
    measureFit();
    setTimeout(refit);  // and once more with the games in, in case the page settled differently
  }
  // The grid's parts (cards and section headings), each one element
  let parts;
  if ($("sort").value === "release") {
    // Unreleased games get their own section after the released ones, soonest release first.
    const soon = rows.filter(isUpcoming).sort((a, b) => nullsLast(a.release_ts, b.release_ts, () => a.release_ts - b.release_ts));
    const out = rows.filter((e) => !isUpcoming(e));
    parts = [...(soon.length && out.length ? [section(`${icon("calendar")} Released`, out.length)] : []), ...out.map(card),
             ...(soon.length ? [section(`${icon("hourglass")} Not released yet`, soon.length), ...soon.map(card)] : [])];
  } else if ($("sort").value === "sale") {
    // Games on sale first (biggest discount first), then the rest
    const onSale = rows.filter((e) => e.discount_pct), full = rows.filter((e) => !e.discount_pct);
    parts = [...(onSale.length ? [section(`${icon("discount")} On sale`, onSale.length)] : []), ...onSale.map(card),
             ...(onSale.length && full.length ? [section("Full price", full.length)] : []), ...full.map(card)];
  } else {
    parts = rows.map(card);
  }
  drawGrid(rows.length ? parts : [`<div class="empty">No games match.</div>`]);
  renderCatchUp();
  // Games 2 or more of us played in the past week (the server keeps the week), latest first
  const playing = DATA.filter((e) => e.recent.length >= 2).sort((a, b) => b.recent[0].at - a.recent[0].at);
  // Not played yet and wanted by two or more people
  const together = DATA.filter((e) => ["want", "demo"].includes(e.status) && e.interest >= 2).length;
  const top = DATA.filter((e) => ["want", "demo"].includes(e.status)).sort((a, b) => b.interest - a.interest)[0];
  const played = DATA.filter((e) => e.status === "played").length;
  // Top scouts: who added the most games (not the bot's free-game posts)
  const added = {};
  DATA.forEach((e) => { if (e.added_by && e.added_by !== CONFIG.clientId) added[e.added_by] = (added[e.added_by] || 0) + 1; });
  const scouts = Object.entries(added).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const podium = (place) => {
    if (!scouts[place - 1]) return "";
    const [id, count] = scouts[place - 1], name = person(id).name;
    const short = name.split(/\s+[(#/|]/)[0];  // "HAZELNUT (Pillcraftian #67)" -> "HAZELNUT"; full name on hover
    return `<span class="podium p${place}">${avatar(id, name)}<span class="podium-name" title="${esc(name)}">${esc(short)}</span>
      <span class="num neon">${count}</span><span class="lbl">${place === 1 ? "games added" : "added"}</span></span>`;
  };
  $("stats").innerHTML = `
    <div class="score"><span class="num neon">${played}</span>
      <span class="lbl">${played === 1 ? "game" : "games"} played together</span></div>
    <div class="score"><span class="num neon">${together}</span>
      <span class="lbl">${together === 1 ? "game" : "games"} people want to play together</span></div>
    ${top?.interest ? `<button class="score top" data-id="${top.id}" title="Show ${esc(top.title)}"
        style="${top.image ? `--cover:url('${esc(imgUrl(top.image))}')` : ""}">
      <span class="top-text"><span class="lbl">Most wanted</span><span class="top-title">${esc(top.title)}</span>
        <span class="stack">${top.interested.slice(0, 5).map((p) => avatar(p.id, p.name)).join("")}${
          top.interested.length > 5 ? `<span class="more">+${top.interested.length - 5}</span>` : ""}</span></span>
      <span class="top-count"><span class="num neon">${top.interest}</span><span class="lbl">want to play</span></span>
    </button>` : ""}
    ${scouts.length ? `<div class="score scout"><span class="scout-head">Top scouts</span>
      <span class="podiums">${podium(2)}${podium(1)}${podium(3)}</span></div>` : ""}`;
  $("mini-playing").textContent = playing.length ? $("now-head").textContent + ": " + playing.map((e) => e.title).join(" · ") : "";
  $("now").hidden = !playing.length;
  $("now-track").innerHTML = playing.map((e) => `<button class="now-item" data-id="${e.id}" title="Show ${esc(e.title)}">
      <span class="now-img" style="${e.image ? `background-image:url('${esc(imgUrl(e.image))}')` : ""}">
        <span class="now-people">${e.recent.slice(0, 6).map((p) => avatar(p.id)).join("")}${
          e.recent.length > 6 ? `<span class="more">+${e.recent.length - 6}</span>` : ""}</span>
      </span>
      <span class="now-body">
        <span class="now-title">${esc(e.title)}</span>
        <span class="now-count"><i></i>${e.players.length ? `${e.players.length} playing now` : `${e.recent.length} played this week`}</span>
      </span>
    </button>`).join("");
  updateNowNav();
}

// Clicking a game in the "Playing now" feed jumps to its card (clearing filters if they hide it).
function jumpToGame(id) {
  let target = $("g" + id);
  if (!target) {
    $("q").value = ""; $("status").value = ""; picked.clear(); personFilter = null; buildGenres();
    render();
    target = $("g" + id);
  }
  target.scrollIntoView({ behavior: "smooth", block: "center" });
  target.classList.add("flash");
  setTimeout(() => target.classList.remove("flash"), 1600);
}
const cleanTitle = (t) => t.replace(/[™®©]/g, "").trim();
function rotationGames() {
  const playing = DATA.filter((e) => e.players.length);
  const wanted = DATA.filter((e) => ["want", "demo"].includes(e.status) && e.interest)
    .sort((a, b) => b.interest - a.interest).slice(0, 8);
  return [...new Map([...playing, ...wanted].map((e) => [e.id, e])).values()];
}
let rotIndex = -1;
function rotateTitle() {
  const games = rotationGames(), el = $("rot");
  rotIndex = (rotIndex + 1) % (games.length + 1);
  const game = games[rotIndex];  // past the last game: plain "next"
  el.textContent = game ? cleanTitle(game.title) : "next";
  el.dataset.id = game ? game.id : "";
  el.title = game ? `Show ${game.title}` : "";
  // the minimised poster shows the same name
  for (const t of [el, $("mini-rot")]) {
    if (t !== el) t.textContent = el.textContent;
    t.classList.remove("swap");
    void t.offsetWidth;  // restart the slide-in animation
    t.classList.add("swap");
  }

}
// On the small poster a long name ("Call of Duty: Modern Warfare 4") gets smaller to fit its line, down to
// half size, instead of being cut off; only past that does the "…" kick in
function fitMiniName() {
  const line = $("mini-rot").parentElement;
  line.style.fontSize = "";
  if (!line.clientWidth || line.scrollWidth <= line.clientWidth) return;  // poster hidden, or it fits
  line.style.fontSize = Math.max(0.5, line.clientWidth / line.scrollWidth * 0.98) + "em";
}
addEventListener("resize", fitMiniName);
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(rotateTitle, 2200);

function updateNowNav() {

// "Looking for …": the search box suggests real things to search for, a few most-wanted games and popular tags
function searchIdeas() {
  const games = rotationGames().slice(0, 4).map((e) => cleanTitle(e.title));
  const counts = {};
  DATA.forEach((e) => [...e.tags, ...e.genres].forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
  const tags = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(3, 7).map((t) => t.toLowerCase());
  return games.flatMap((g, i) => [g, tags[i]]).filter(Boolean);
}
let ideaIndex = 0;
function nextIdea() {
  const ideas = searchIdeas();
  if (ideas.length) $("q").placeholder = `${ideas[ideaIndex++ % ideas.length]}…`;
}
nextIdea();
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(nextIdea, 2600);
// Press "/" anywhere (not while typing) to jump to the search box
addEventListener("keydown", (ev) => {
  if (ev.key !== "/" || ev.ctrlKey || ev.metaKey || ev.target.closest("input, textarea, select")) return;
  ev.preventDefault();
  $("q").focus();
});
$("genre-list").addEventListener("change", (ev) => {
  ev.target.checked ? picked.add(ev.target.value) : picked.delete(ev.target.value);
  genreLabel();
  render();
});
$("genre-q").addEventListener("input", findGenre);
// The menu opens under its button, kept inside the screen. The sticky bar's blur makes the bar,
// not the screen, what a fixed element is placed against, so positions are relative to the bar.
function placeGenre() {
  if (!$("genre").open) return;
  const panel = $("genre").querySelector(".multi-panel"), r = $("genre-label").getBoundingClientRect();
  const bar = $("genre").closest(".bar").getBoundingClientRect();
  const left = Math.max(16, Math.min(r.left, document.documentElement.clientWidth - 16 - panel.offsetWidth));
  panel.style.top = r.bottom + 6 - bar.top + "px";
  panel.style.left = left - bar.left + "px";
}
$("genre").addEventListener("toggle", placeGenre);
addEventListener("resize", placeGenre);
$("genre-clear").addEventListener("click", () => { picked.clear(); buildGenres(); render(); });
$("person").addEventListener("click", (ev) => { if (ev.target.closest("#person-clear")) setPersonFilter(null); });
document.addEventListener("click", (ev) => { if ($("genre").open && !$("genre").contains(ev.target)) $("genre").open = false; });
// Clicking a tag on a card ticks it too
$("grid").addEventListener("click", (ev) => {
  const tag = ev.target.closest(".chip")?.dataset.tag;
  if (tag) { picked.add(tag); buildGenres(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
});
buildGenres();
render();

if (CONFIG.live) {
  // Stay live: a tiny version number is checked every few seconds and the data is only reloaded when it
  // changed (someone posted, pressed a button, changed a status). Filters and search are kept.
  // A reload waits while your own changes are being saved, and is dropped if one was saved while it downloaded
  // (it may hold your old answer): the next check loads it again. One check at a time, even on a slow connection.
  let version = null, checking = false;
  setInterval(async () => {
    if (document.hidden || menuInUse() || checking) return;  // don't redraw under an open menu
    if (redrawWaiting) renderWhenFree();
    checking = true;
    try {
      const v = (await (await fetch("/version")).json()).v;
      if ((version !== null && v !== version) || reloadNow) {
        const seq = saveCount;
        const res = await fetch("/data.json" + location.search, authHeaders());
        if (!res.ok) return;
        const body = await res.json();
        if (saving || seq !== saveCount) return;
        ({ games: DATA, users: USERS } = body);
        reloadNow = false;
        buildGenres();
        renderWhenFree();
      }
      version = v;
    } catch {
    } finally {
      checking = false;
    }
  }, 3000);
  // Who's online changes without the catalog changing: the dots are fetched on their own, and set in place
  setInterval(async () => {
    if (document.hidden || (CONFIG.locked && !token)) return;
    try {
      const status = await (await fetch("/status.json" + location.search, authHeaders())).json();
      for (const [id, s] of Object.entries(status)) if (USERS[id]) USERS[id].status = s;
      document.querySelectorAll("[data-sid]").forEach((el) => {
        const s = status[el.dataset.sid];
        if (s && el.dataset.status !== s) el.dataset.status = s;
      });
    } catch {}
  }, 20000);
}

if (IN_DISCORD) {
  // Running inside Discord as an Activity: say hello to Discord, and open links in the real browser.
  try {
    const { DiscordSDK } = await import("/static/discord-sdk.mjs");
    sdk = new DiscordSDK(CONFIG.clientId);
    await sdk.ready();
    // Minimised (picture-in-picture) or tiled in a call grid: show the compact poster instead of the full page.
    sdk.subscribe("ACTIVITY_LAYOUT_MODE_UPDATE", ({ layout_mode }) => {
      const was = isMini();
      document.body.classList.toggle("mini", layout_mode === 1 || layout_mode === 2);
      fitMiniName();
      if (was && !isMini()) restoreScroll();
    })
      .catch((err) => console.warn("No layout updates", err));
    // Sign in right away so the buttons show which games you already want (asks for permission only once).
    if (CAN_WANT) signIn().then(() => { renderWhenFree(); activityTip(); }).catch((err) => console.warn("Not signed in yet", err));
    document.addEventListener("click", async (ev) => {
      const a = ev.target.closest("a[href^='http']");
      if (!a) return;
      ev.preventDefault();
      // A Steam game: first ask Discord to hand steam:// straight to the Steam app (no browser tab at all);
      // if Discord won't open that kind of link, go through the hand-off page in the browser instead.
      const app = /open-steam\.html\?app=(\d+)/.exec(a.href)?.[1];
      if (app) {
        try {
          const { opened } = await sdk.commands.openExternalLink({ url: `steam://store/${app}` });
          if (opened !== false) return;
        } catch (err) {
          console.warn("Discord won't open steam:// links, using the browser", err);
        }
      }
      sdk.commands.openExternalLink({ url: a.href });
    });
  } catch (err) { console.error("Discord SDK failed", err); }
}
</script>
