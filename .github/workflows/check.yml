# Runs pyflakes on every push and pull request, catching typos, missing imports and unused names, and the unit tests
name: Check

on: [push, pull_request]

jobs:
  pyflakes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes==4.1.0
      - run: pyflakes *.py tools/*.py tests/*.py
      - run: python -m unittest -v  # standard library only, so nothing to install
